# SwiftLint configuration — server baseline for Vapor / Swift 6.
# SwiftFormat handles layout; SwiftLint handles structural and concurrency safety.

included:
  - Sources
  - Tests

excluded:
  - .build
  - "**/.build"
  - .swiftpm
  - .worktrees

disabled_rules:
  - trailing_whitespace
  - trailing_newline
  - opening_brace
  - line_length
  - identifier_name
  - todo
  - cyclomatic_complexity
  - function_body_length
  - type_body_length
  - file_length
  - large_tuple
  - nesting
  - shorthand_operator

opt_in_rules:
  - force_unwrapping
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - sorted_first_last
  - contains_over_first_not_nil
  - unused_import
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - redundant_nil_coalescing
  - shorthand_optional_binding
  - unowned_variable_capture
  - weak_delegate
  - yoda_condition

force_unwrapping:
  severity: warning

empty_count:
  severity: warning

function_parameter_count:
  warning: 10
  error: 15

trailing_comma:
  mandatory_comma: true

type_name:
  allowed_symbols: ["_"]
  min_length: 2
  max_length: 60

reporter: "xcode"
